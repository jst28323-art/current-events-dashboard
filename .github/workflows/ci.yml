# CI: the same gate a session runs locally (node scripts/gate.mjs), in --ci mode (no stamp, no clean-tree check).
name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies (once a lockfile exists)
        if: hashFiles('package-lock.json') != ''
        run: npm ci
      - name: Install the Playwright browser (the web e2e suite runs in the gate)
        if: hashFiles('package-lock.json') != ''
        run: npx playwright install --with-deps chromium webkit
      - name: Gate
        run: node scripts/gate.mjs --ci
