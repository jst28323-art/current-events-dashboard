# Builds apps/web and deploys it to GitHub Pages only after the ci workflow has PASSED on main (never from a red or ungated push), and on
# demand from the Actions tab. The deploy checks out the exact commit CI passed. Pages is the static front door
# (docs/ARCHITECTURE.md); live data will come from Cloudflare, never from Actions cron (D-008).
name: pages
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build the web app
        run: npm run build -w apps/web
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist
      - id: deployment
        uses: actions/deploy-pages@v5
