# Deploys site/ to GitHub Pages on every push to main (and on demand from the Actions tab).
# Every push, not only site/ changes: a path filter skipped the very first deploy, and the local token cannot dispatch
# workflows (docs/TRAPS.md). Pages is the static front door (docs/ARCHITECTURE.md); live data will come from Cloudflare,
# never from Actions cron (D-008).
name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
